name: Optional CodeQL
# Private-repository availability depends on account licensing. No paid plan is enabled here.
on:
  workflow_dispatch:
    inputs:
      enabled:
        type: boolean
        default: false
        description: 'Run only after confirming native CodeQL is available without a paid enrollment'
permissions:
  contents: read
jobs:
  analyze:
    if: github.event.repository.private == false && inputs.enabled
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@d0bae162f31f17dd92c46ccdc4dfee5710f8dc67 # v3
        with:
          languages: python
      - uses: github/codeql-action/analyze@d0bae162f31f17dd92c46ccdc4dfee5710f8dc67 # v3
