repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: gitleaks
        name: Gitleaks staged secrets
        entry: gitleaks git --pre-commit --redact --staged --no-banner
        language: system
        pass_filenames: false
