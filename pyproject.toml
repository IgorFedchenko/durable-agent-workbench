[project]
name = "durable-agent-workbench"
version = "0.1.0"
description = "A local, evidence-bound agent workflow with durable recovery and a real Docker sandbox"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "pydantic>=2.11,<3", "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "jinja2>=3.1,<4",
  "openai>=2.0,<3", "anthropic>=0.70,<2", "opentelemetry-api>=1.30,<2", "opentelemetry-sdk>=1.30,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
]
[project.scripts]
workbench = "agent_workbench.cli:main"
[project.entry-points.pytest11]
workbench_policy = "agent_workbench.pytest_policy"

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-timeout>=2.3,<3", "httpx>=0.28,<1", "playwright>=1.50,<2", "ruff>=0.11,<1", "mypy>=1.15,<2", "pillow>=11,<13", "bandit>=1.8,<2"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/agent_workbench"]
[tool.hatch.build.targets.wheel.force-include]
"datasets" = "agent_workbench/assets/datasets"
"prompts" = "agent_workbench/assets/prompts"
"recordings" = "agent_workbench/assets/recordings"
"evals" = "agent_workbench/assets/evals"

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
[tool.mypy]
python_version = "3.12"
strict = true
[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 180
xfail_strict = true
markers = ["docker: real Docker boundary", "e2e: real browser and server"]
